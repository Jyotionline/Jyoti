<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Account | Jyoti Store</title><link rel="stylesheet" href="styles.css"></head><body data-page="account"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">J</span><span>Jyoti Store</span></a><nav><a href="index.html">Home</a><a href="orders.html">Your Orders</a><a class="active" href="account.html">Account</a><a href="about.html">About Us</a><a href="contact.html">Contact</a><a class="cart-link" href="cart.html">Cart <b id="cart-count">0</b></a></nav></header><main class="container narrow page-space"><span class="eyebrow">YOUR DETAILS</span><h1>Account & saved address</h1><div class="notice">Customer login will use verified phone OTP when Firebase Phone Authentication is configured. A name + phone number alone is not secure authentication.</div><section class="panel"><h2>Sign in</h2><div id="account-auth"><label>Phone number<input id="login-phone" placeholder="+91 98765 43210" inputmode="tel"></label><div id="recaptcha-container"></div><button class="button" id="send-otp" type="button">Send OTP</button><label>OTP code<input id="login-otp" inputmode="numeric" placeholder="6-digit code"></label><button class="button secondary" id="verify-otp" type="button">Verify OTP</button><p id="auth-message" class="muted"></p></div></section><form id="account-form" class="panel form-grid"><h2 class="full">Saved delivery address</h2><label>Full name<input id="account-name" required></label><label>Phone number<input id="account-phone" required inputmode="tel"></label><label class="full">Flat / House no. / Building / Company / Apartment<input id="account-line1" required></label><label class="full">Area / Street / Sector / Village<input id="account-line2" required></label><label class="full">Landmark<input id="account-landmark"></label><label>Pincode<input id="account-pin" required inputmode="numeric"></label><label>Town / City<input id="account-city" required></label><label class="full">State<input id="account-state" required></label><button class="button full" type="submit">Save address</button><p id="account-message" class="muted full"></p></form></main><script type="module" src="app.js"></script></body></html>
